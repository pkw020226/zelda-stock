<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0e13"><title>젤다 40주년 프로콘 재고판</title><style>
:root{color-scheme:dark;--bg:#090c11;--p:#121721;--l:#26303e;--t:#f7f8fa;--m:#99a5b5;--g:#34d399;--r:#fb7185;--y:#fbbf24}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.w{max-width:1120px;margin:auto;padding:26px 16px 60px}header{display:flex;justify-content:space-between;gap:15px;align-items:end;flex-wrap:wrap}h1{font-size:27px;margin:0}.sub,.small{color:var(--m)}.toolbar{display:flex;gap:8px;margin:22px 0;flex-wrap:wrap}button,select,a.buy{border:1px solid var(--l);background:#171e29;color:var(--t);border-radius:11px;padding:10px 12px;font-weight:700;text-decoration:none;cursor:pointer}.summary{padding:13px 15px;border:1px solid var(--l);border-radius:14px;background:#0f141c;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(275px,1fr));gap:12px}.card{border:1px solid var(--l);border-radius:16px;background:var(--p);padding:16px}.row{display:flex;justify-content:space-between;gap:8px}.name{font-weight:850}.badge{font-size:12px;padding:5px 8px;border-radius:999px;font-weight:900}.available{background:#103a30;color:#78f2c6}.soldout{background:#421822;color:#ffa0b0}.unknown{background:#3b3113;color:#ffdc70}.price{font-size:22px;font-weight:900;margin:17px 0 7px}.reason{font-size:13px;color:var(--m);min-height:55px;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere}.bottom{display:flex;gap:8px;margin-top:14px}.bottom>*{flex:1;text-align:center}.foot{font-size:12px;color:var(--m);margin-top:22px;line-height:1.6}.spin{opacity:.55;pointer-events:none}
</style></head><body><main class="w"><header><div><h1>젤다 40주년 프로콘 재고판</h1><div class="sub">국내 정발 · 디스플레이 스탠드 포함 · 139,800원 이하</div></div><div class="small" id="time">아직 확인 전</div></header><div class="toolbar"><button id="refresh">전체 다시 확인</button><select id="filter"><option value="all">전체</option><option value="available">구매 가능</option><option value="soldout">품절</option><option value="unknown">확인 불가</option></select></div><div class="summary" id="summary">판매처 상태를 확인하고 있습니다…</div><section class="grid" id="grid"></section><div class="foot">판정 원칙: 검색 결과·가격 표시·장바구니/구매 버튼만으로는 재고로 인정하지 않습니다. 명시적 품절 신호가 있으면 품절, 명시적 재고 수량/구매 가능 신호가 있을 때만 구매 가능으로 표시합니다. 차단·로그인·동적 렌더링 등으로 확정할 수 없으면 ‘확인 불가’로 남깁니다.</div></main><script>
let data=[];const $=s=>document.querySelector(s);function lab(s){return s==='available'?'구매 가능':s==='soldout'?'품절':'확인 불가'}function render(){let f=$('#filter').value,d=f==='all'?data:data.filter(x=>x.status===f);$('#grid').innerHTML=d.map(x=>`<article class="card"><div class="row"><div class="name">${x.name}</div><span class="badge ${x.status}">${lab(x.status)}</span></div><div class="price">${Number(x.price).toLocaleString()}원</div><div class="reason">${String(x.reason||'').slice(0,120)}<br>HTTP ${x.httpStatus??'-'} · ${x.elapsedMs??'-'}ms</div><div class="bottom"><a class="buy" href="${x.url}" target="_blank" rel="noopener">상품 페이지</a><button onclick="one('${x.id}')">이곳만 재확인</button></div></article>`).join('');let a=data.filter(x=>x.status==='available').length,s=data.filter(x=>x.status==='soldout').length,u=data.filter(x=>x.status==='unknown').length;$('#summary').textContent=`구매 가능 ${a} · 품절 ${s} · 확인 불가 ${u} · 총 ${data.length}곳`;}
async function all(){document.body.classList.add('spin');try{let r=await fetch('/api/check',{cache:'no-store'});let j=await r.json();data=j.results;$('#time').textContent='마지막 확인 '+new Date(j.generatedAt).toLocaleString('ko-KR');render()}catch(e){$('#summary').textContent='조회 실패: '+e.message}finally{document.body.classList.remove('spin')}}window.one=async id=>{let r=await fetch('/api/check/'+encodeURIComponent(id),{cache:'no-store'}),j=await r.json();data=data.map(x=>x.id===id?j:x);render()};$('#refresh').onclick=all;$('#filter').onchange=render;all();setInterval(all,120000);
</script></body></html>
